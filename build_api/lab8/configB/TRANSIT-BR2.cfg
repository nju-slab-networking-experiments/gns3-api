! LAB8-B incremental console commands for TRANSIT-BR2
! Apply only to a verified normal LAB7 project; the loader saves fault state before stopping devices.

! Incident 1 - document section 5.1
enable
configure terminal
ip prefix-list PL-AS65300 seq 90 permit 0.0.0.0/0 le 32
end
clear ip bgp 100.64.0.16 soft in

! Incident 2 - document section 5.2
enable
configure terminal
route-map OUT-CUSTOMER permit 10
 no match community LAB-CUSTOMER LAB-PEER
 match community LAB-CUSTOMER
 exit
route-map OUT-PEER permit 10
 no match community LAB-CUSTOMER
 match community LAB-CUSTOMER LAB-PEER
 exit
end
clear ip bgp 100.64.0.10 soft out
clear ip bgp 100.64.0.14 soft out
clear ip bgp 100.64.0.16 soft out
