! LAB8-A incremental console commands for ISP-A-BR1
! Apply only to a verified normal LAB7 project; the loader saves fault state before stopping devices.

! Incident 1 - document section 4.1
enable
configure terminal
ip route 0.0.0.0 0.0.0.0 Null0 1
ip route 100.64.100.0 255.255.255.0 Null0 1
ip route 10.10.128.0 255.255.255.0 Null0 1
ip route 198.18.128.0 255.255.255.0 Null0 1
ip prefix-list LAB8-A-INJECT seq 10 permit 0.0.0.0/0
ip prefix-list LAB8-A-INJECT seq 20 permit 100.64.100.0/24
ip prefix-list LAB8-A-INJECT seq 30 permit 10.10.128.0/24
ip prefix-list LAB8-A-INJECT seq 40 permit 198.18.128.0/24
route-map OUT-TRANSIT permit 90
 match ip address prefix-list LAB8-A-INJECT
 set metric 0
 exit
router bgp 65100
 network 0.0.0.0 mask 0.0.0.0
 network 100.64.100.0 mask 255.255.255.0
 network 10.10.128.0 mask 255.255.255.0
 network 198.18.128.0 mask 255.255.255.0
 default-information originate
 exit
end
clear ip bgp 100.64.0.13 soft out
