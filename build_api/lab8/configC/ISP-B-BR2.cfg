! LAB8-C incremental console commands for ISP-B-BR2
! Apply only to a verified normal LAB7 project; the loader saves fault state before stopping devices.

! Incident 1 - document section 6.1
enable
configure terminal
ip route 0.0.0.0 0.0.0.0 Null0 1
ip route 100.64.100.0 255.255.255.0 Null0 1
ip route 10.10.130.0 255.255.255.0 Null0 1
ip route 198.18.130.0 255.255.255.0 Null0 1
ip prefix-list LAB8-C-INJECT seq 10 permit 0.0.0.0/0
ip prefix-list LAB8-C-INJECT seq 20 permit 100.64.100.0/24
ip prefix-list LAB8-C-INJECT seq 30 permit 10.10.130.0/24
ip prefix-list LAB8-C-INJECT seq 40 permit 198.18.130.0/24
route-map OUT-TRANSIT permit 90
 match ip address prefix-list LAB8-C-INJECT
 set metric 0
 exit
router bgp 65300
 network 0.0.0.0 mask 0.0.0.0
 network 100.64.100.0 mask 255.255.255.0
 network 10.10.130.0 mask 255.255.255.0
 network 198.18.130.0 mask 255.255.255.0
 default-information originate
 exit
end
clear ip bgp 100.64.0.19 soft out
