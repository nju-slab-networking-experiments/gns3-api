! Incident 2 - document section 6.2
enable
configure terminal
route-map OUT-CUSTOMER permit 10
 no match community LAB-CUSTOMER LAB-PEER
 match community LAB-CUSTOMER
 exit
route-map OUT-PEER permit 10
 no match community LAB-CUSTOMER
 match community LAB-CUSTOMER LAB-PEER
 exit
end
clear ip bgp 100.64.0.10 soft out
clear ip bgp 100.64.0.14 soft out
clear ip bgp 100.64.0.16 soft out

