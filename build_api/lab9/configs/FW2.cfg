enable
configure terminal
hostname FW2
no ip domain-lookup
ip routing
no ip http server
no ip http secure-server
logging buffered 64000 informational
ip access-list extended NAT-SOURCES
 deny ip 10.10.0.0 0.0.255.255 10.10.0.0 0.0.255.255
 permit ip 10.10.0.0 0.0.255.255 any
exit
route-map NAT-WAN permit 10
 match ip address NAT-SOURCES
 match interface FastEthernet0/0
exit
ip nat inside source route-map NAT-WAN interface FastEthernet0/0 overload
interface FastEthernet0/0
 ip address 10.10.253.3 255.255.255.254
 ip nat outside
 no shutdown
exit
interface FastEthernet0/1
 no ip address
 no shutdown
 speed 100
 duplex full
exit
interface FastEthernet0/1.10
 encapsulation dot1Q 10
 ip address 10.10.10.3 255.255.255.0
 ip nat inside
 no ip redirects
 standby 10 ip 10.10.10.1
 standby 10 priority 100
 standby 10 preempt delay minimum 30
 standby 10 track FastEthernet0/0 60
exit
interface FastEthernet0/1.20
 encapsulation dot1Q 20
 ip address 10.10.20.3 255.255.255.0
 ip nat inside
 no ip redirects
 standby 20 ip 10.10.20.1
 standby 20 priority 100
 standby 20 preempt delay minimum 30
 standby 20 track FastEthernet0/0 60
exit
interface FastEthernet0/1.30
 encapsulation dot1Q 30
 ip address 10.10.30.3 255.255.255.0
 ip nat inside
 no ip redirects
 standby 30 ip 10.10.30.1
 standby 30 priority 100
 standby 30 preempt delay minimum 30
 standby 30 track FastEthernet0/0 60
exit
interface FastEthernet0/1.40
 encapsulation dot1Q 40
 ip address 10.10.40.3 255.255.255.0
 ip nat inside
 no ip redirects
 standby 40 ip 10.10.40.1
 standby 40 priority 100
 standby 40 preempt delay minimum 30
 standby 40 track FastEthernet0/0 60
exit
router ospf 1
 router-id 10.10.255.22
 passive-interface default
 no passive-interface FastEthernet0/0
 network 10.10.253.3 0.0.0.0 area 0
 network 10.10.0.0 0.0.255.255 area 0
exit
end
write memory
