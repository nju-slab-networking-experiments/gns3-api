enable
configure terminal
hostname AGG1
no ip domain-lookup
no ip routing
vtp mode transparent
line console 0
 exec-timeout 0 0
 logging synchronous
 exit
spanning-tree mode rapid-pvst
vlan 10
 name OFFICE
exit
vlan 20
 name TRUST
exit
vlan 30
 name DMZ
exit
vlan 40
 name MGMT
exit
vlan 999
 name UNUSED
exit
spanning-tree vlan 10 priority 32768
spanning-tree vlan 20 priority 32768
spanning-tree vlan 30 priority 32768
spanning-tree vlan 40 priority 32768
interface range GigabitEthernet0/0 - 3
 switchport mode access
 switchport access vlan 999
 shutdown
exit
interface range GigabitEthernet1/0 - 3
 switchport mode access
 switchport access vlan 999
 shutdown
exit
interface GigabitEthernet0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,2,10,20,30,40,1002-1005
 no shutdown
exit
interface range GigabitEthernet0/1 - 2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,2,10,20,30,40,1002-1005
 shutdown
exit
interface GigabitEthernet0/3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,2,30,40,1002-1005
 no shutdown
exit
interface GigabitEthernet1/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,2,30,40,1002-1005
 no shutdown
exit
interface GigabitEthernet1/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,2,10,20,40,1002-1005
 no shutdown
exit
interface GigabitEthernet1/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,2,10,20,40,1002-1005
 no shutdown
exit
interface Vlan40
 ip address 10.10.40.201 255.255.255.0
 no shutdown
exit
end
write memory
