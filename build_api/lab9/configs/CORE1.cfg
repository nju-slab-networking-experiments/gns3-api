enable
configure terminal
hostname CORE1
no ip domain-lookup
ip routing
ip cef
interface Loopback0
 ip address 10.10.255.11 255.255.255.255
exit
interface FastEthernet0/0
 ip address 10.10.252.1 255.255.255.254
 no shutdown
exit
interface FastEthernet0/1
 ip address 10.10.252.5 255.255.255.254
 no shutdown
exit
interface FastEthernet1/0
 ip address 10.10.253.0 255.255.255.254
 no shutdown
exit
router ospf 1
 router-id 10.10.255.11
 passive-interface default
 network 10.10.255.11 0.0.0.0 area 0
 network 10.10.252.1 0.0.0.0 area 0
 no passive-interface FastEthernet0/0
 network 10.10.252.5 0.0.0.0 area 0
 no passive-interface FastEthernet0/1
 network 10.10.253.0 0.0.0.0 area 0
 no passive-interface FastEthernet1/0
end
write memory
