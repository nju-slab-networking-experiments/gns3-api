enable
configure terminal
hostname ER2
no ip domain-lookup
ip routing
ip cef
interface Loopback0
 ip address 10.10.255.2 255.255.255.255
exit
interface FastEthernet0/0
 ip address 172.16.10.2 255.255.255.254
 no shutdown
exit
interface FastEthernet0/1
 ip address 10.10.252.4 255.255.255.254
 no shutdown
exit
interface FastEthernet1/0
 ip address 10.10.252.6 255.255.255.254
 no shutdown
exit
ip route 0.0.0.0 0.0.0.0 172.16.10.3
router ospf 1
 router-id 10.10.255.2
 passive-interface default
 network 10.10.255.2 0.0.0.0 area 0
 network 172.16.10.2 0.0.0.0 area 0
 no passive-interface FastEthernet0/0
 network 10.10.252.4 0.0.0.0 area 0
 no passive-interface FastEthernet0/1
 network 10.10.252.6 0.0.0.0 area 0
 no passive-interface FastEthernet1/0
 default-information originate metric 100 metric-type 1
end
write memory
