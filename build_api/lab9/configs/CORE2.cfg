enable
configure terminal
hostname CORE2
no ip domain-lookup
ip routing
ip cef
interface Loopback0
 ip address 10.10.255.12 255.255.255.255
exit
interface FastEthernet0/0
 ip address 10.10.252.3 255.255.255.254
 no shutdown
exit
interface FastEthernet0/1
 ip address 10.10.252.7 255.255.255.254
 no shutdown
exit
interface FastEthernet1/0
 ip address 10.10.253.2 255.255.255.254
 no shutdown
exit
router ospf 1
 router-id 10.10.255.12
 passive-interface default
 network 10.10.255.12 0.0.0.0 area 0
 network 10.10.252.3 0.0.0.0 area 0
 no passive-interface FastEthernet0/0
 network 10.10.252.7 0.0.0.0 area 0
 no passive-interface FastEthernet0/1
 network 10.10.253.2 0.0.0.0 area 0
 no passive-interface FastEthernet1/0
end
write memory
