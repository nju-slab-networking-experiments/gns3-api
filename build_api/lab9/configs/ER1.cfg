enable
configure terminal
hostname ER1
no ip domain-lookup
ip routing
ip cef
interface Loopback0
 ip address 10.10.255.1 255.255.255.255
exit
interface FastEthernet0/0
 ip address 172.16.10.0 255.255.255.254
 no shutdown
exit
interface FastEthernet0/1
 ip address 10.10.252.0 255.255.255.254
 no shutdown
exit
interface FastEthernet1/0
 ip address 10.10.252.2 255.255.255.254
 no shutdown
exit
ip route 0.0.0.0 0.0.0.0 172.16.10.1
router ospf 1
 router-id 10.10.255.1
 passive-interface default
 network 10.10.255.1 0.0.0.0 area 0
 network 172.16.10.0 0.0.0.0 area 0
 no passive-interface FastEthernet0/0
 network 10.10.252.0 0.0.0.0 area 0
 no passive-interface FastEthernet0/1
 network 10.10.252.2 0.0.0.0 area 0
 no passive-interface FastEthernet1/0
 default-information originate metric 10 metric-type 1
end
write memory
