enable
configure terminal
hostname ISP
no ip domain-lookup
ip routing
ip cef
interface FastEthernet0/0
 ip address 172.16.10.1 255.255.255.254
 no shutdown
exit
interface FastEthernet0/1
 ip address 172.16.10.3 255.255.255.254
 no shutdown
exit
interface Loopback0
 ip address 203.0.113.80 255.255.255.255
 no shutdown
exit
ip prefix-list NO-DEFAULT seq 5 deny 0.0.0.0/0
ip prefix-list NO-DEFAULT seq 10 permit 0.0.0.0/0 le 32
router ospf 1
 router-id 10.10.255.254
 passive-interface default
 no passive-interface FastEthernet0/0
 no passive-interface FastEthernet0/1
 network 172.16.10.1 0.0.0.0 area 0
 network 172.16.10.3 0.0.0.0 area 0
 network 203.0.113.80 0.0.0.0 area 0
 distribute-list prefix NO-DEFAULT in
exit
end
write memory
