enable
vlan database
 vtp transparent
 vlan 10 name OFFICE
 vlan 20 name TRUST
 vlan 30 name DMZ
 vlan 40 name MGMT
 vlan 999 name UNUSED
exit
configure terminal
hostname TRUST-SW1
no ip domain-lookup
no ip routing
spanning-tree vlan 10 priority 32768
spanning-tree vlan 20 priority 32768
spanning-tree vlan 30 priority 32768
spanning-tree vlan 40 priority 32768
interface range FastEthernet1/0 - 15
 switchport mode access
 switchport access vlan 999
 shutdown
exit
interface range FastEthernet0/0 - 1
 shutdown
exit
interface FastEthernet1/0
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,2,10,20,40,1002-1005
 no shutdown
exit
interface FastEthernet1/1
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,2,10,20,40,1002-1005
 no shutdown
exit
interface FastEthernet1/2
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,2,20,40,1002-1005
 no shutdown
exit
interface FastEthernet1/3
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,2,20,40,1002-1005
 no shutdown
exit
interface FastEthernet1/4
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,2,20,40,1002-1005
 no shutdown
exit
interface FastEthernet1/5
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
exit
interface Vlan40
 ip address 10.10.40.221 255.255.255.0
 no shutdown
exit
end
write memory
