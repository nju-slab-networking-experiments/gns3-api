enable
vlan database
 vtp transparent
 vlan 20 name TRUST
 vlan 30 name DMZ
 vlan 40 name MGMT
 vlan 999 name UNUSED
exit
configure terminal
hostname HV1
no ip domain-lookup
ip routing
ip cef
spanning-tree vlan 1 priority 61440
spanning-tree vlan 2 priority 61440
spanning-tree vlan 20 priority 61440
spanning-tree vlan 30 priority 61440
spanning-tree vlan 40 priority 61440
ip vrf TRUST
 rd 65000:20
exit
ip vrf DMZ
 rd 65000:30
exit
ip vrf MGMT
 rd 65000:40
exit
ip vrf VMA
 rd 65000:50
exit
ip vrf VMB
 rd 65000:51
exit
interface range FastEthernet1/0 - 15
 switchport mode access
 switchport access vlan 999
 shutdown
exit
interface FastEthernet1/0
 switchport mode access
 switchport access vlan 30
 no spanning-tree portfast
 spanning-tree cost 10000
 no shutdown
exit
interface FastEthernet1/1
 switchport mode access
 switchport access vlan 30
 no spanning-tree portfast
 spanning-tree cost 20000
 no shutdown
exit
interface FastEthernet1/2
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,2,20,40,1002-1005
 no spanning-tree portfast
 spanning-tree cost 10000
 no shutdown
exit
interface FastEthernet1/3
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan 1,2,20,40,1002-1005
 no spanning-tree portfast
 spanning-tree cost 20000
 no shutdown
exit
interface Vlan20
 ip vrf forwarding TRUST
 ip address 10.10.20.101 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no shutdown
exit
interface Vlan30
 ip vrf forwarding DMZ
 ip address 10.10.30.101 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no shutdown
exit
interface Vlan40
 ip vrf forwarding MGMT
 ip address 10.10.40.101 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no shutdown
exit
interface FastEthernet0/0
 ip vrf forwarding VMA
 ip address 10.10.50.101 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no shutdown
exit
interface FastEthernet0/1
 ip vrf forwarding VMB
 ip address 10.10.50.101 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no shutdown
exit
ip route vrf TRUST 0.0.0.0 0.0.0.0 10.10.20.1
ip route vrf DMZ 0.0.0.0 0.0.0.0 10.10.30.1
ip route vrf MGMT 0.0.0.0 0.0.0.0 10.10.40.1
end
write memory
