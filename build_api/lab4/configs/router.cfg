# IOS configuration-mode commands; the builder enters config mode and saves startup-config.
hostname R1-IOSv
no ip domain-lookup
no logging console
interface GigabitEthernet0/0
description TO-CLIENT
ip address 10.10.10.1 255.255.255.0
no shutdown
exit
interface GigabitEthernet0/1
description TO-SERVER
ip address 10.20.20.1 255.255.255.0
no shutdown
exit
